# nginx-acm — fronting reverse proxy for the Traefik-fronted deploy mode.
#
# Routing matches what Caddy does in the Caddyfile-based deploy:
#   /api/*  → api:8000 (prefix stripped via the trailing slash in proxy_pass)
#   /*      → web:3000 (Next.js standalone)
#
# Traefik terminates the public TLS and forwards inside docker as
# https://nginx-acm:443 (with insecureSkipVerify so the self-signed cert
# is accepted). We terminate that TLS here and pass plaintext HTTP to api
# and web on the internal docker network.

# Required by Next.js standalone proxying: pass the upstream's WebSocket
# upgrade headers when it asks for one (currently only used by
# /_next/webpack-hmr in dev — prod is a no-op but cheap to support).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 25 MB is enough headroom for the WP media upload path (15 MB cap in
    # the cms client) plus typical JSON payloads.
    client_max_body_size 25m;

    # Forwarded-header set is "Traefik handed it to us, we hand it onward."
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Long-running publish jobs can take ~330s under retry/backoff.
    # Set generously so we don't 504 ahead of the worker.
    proxy_read_timeout  360s;
    proxy_send_timeout  360s;

    # ----- API -----
    # Trailing slash on proxy_pass + matching trailing slash on location
    # strips the `/api` prefix, mirroring Caddy's `handle_path /api/*` rule.
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # ----- Web (Next.js) -----
    # `/` plus Next's static assets (_next, favicon, etc) all go to web.
    location / {
        proxy_pass http://web:3000;
    }

    # ----- nginx itself -----
    # Lightweight health probe Traefik (or anyone else inside docker) can hit.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Optional plain-HTTP on 80 → permanent redirect.
# Traefik already does http→https at the public edge, so this is only
# useful if you ever publish 80 from this container directly.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
