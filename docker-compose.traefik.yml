# Traefik-fronted production override.
#
# Use as a THIRD overlay on top of the base + prod compose files:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.traefik.yml \
#     up -d --build
#
# What this layer does vs the Caddy-fronted prod overlay:
#   - Disables the `caddy` service (it stays in the compose graph but its
#     entrypoint is no-op'd so it exits immediately and never binds 80/443).
#     We don't remove it outright because Compose overlays can only override
#     existing fields, not delete services. The result is one harmless
#     `Exited (0)` container in `docker compose ps`.
#   - Adds `nginx-acm` — a thin nginx that mirrors what Caddy was doing
#     (terminate TLS with a self-signed cert, route `/api/*` to api and
#     everything else to web). Joins the external `traefik_proxy` network
#     so the host's Traefik can reach it by service name as
#     `https://nginx-acm:443`.
#   - Does NOT publish any host ports. Traefik (running outside this stack
#     on the same host) is the only thing the outside world reaches.
#
# Before first up, generate the self-signed cert pair:
#
#   bash nginx/gen-cert.sh
#
# And add the matching router/service entry to Traefik's dynamic config
# (see DEPLOY.md → "Traefik-fronted deployment").

services:
  caddy:
    # Neuter the existing caddy service so it doesn't grab 80/443.
    # Override `entrypoint` so the container starts, immediately exits 0,
    # and stays out of the way. The `restart: "no"` makes sure Compose
    # doesn't bounce it.
    entrypoint: ["true"]
    command: []
    restart: "no"
    # Drop the host port bindings. `!reset []` is the v2.20+ idiom that
    # *replaces* the parent list rather than merging into it.
    ports: !reset []
    healthcheck:
      disable: true
    depends_on: !reset []

  # ----- fronting nginx (the thing Traefik actually talks to) -----
  #
  # Lives on TWO networks:
  #   - default          (the implicit acm internal net — to reach api + web)
  #   - traefik_proxy    (external — Traefik can reach us by service name)
  #
  # No host port mapping: Traefik connects to us inside docker.
  nginx-acm:
    image: nginx:1.25-alpine
    container_name: nginx-acm
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - default
      - traefik_proxy
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128m
    # Optional: expose 8443 on the host *only* for localhost testing of this
    # Traefik mode without running Traefik. Comment out for real deploys.
    #
    # ports:
    #   - "127.0.0.1:8443:443"

networks:
  # Declared external so `nginx-acm` can join the same docker network
  # Traefik lives on. Create it once on the host with:
  #   docker network create traefik_proxy
  # (or `docker network create --driver=bridge traefik_proxy` if you want
  #  to be explicit).
  traefik_proxy:
    external: true
