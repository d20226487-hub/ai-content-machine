services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acm_dev}
      POSTGRES_DB: ${POSTGRES_DB:-acm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis is the Celery broker, so it holds the not-yet-processed half of
    # every bulk run. With the image defaults (RDB only, save 3600/300/60) a
    # host crash can drop everything enqueued since the last snapshot — for a
    # 1500-cell run that's potentially the whole queue. AOF brings worst-case
    # loss down to ~1s of writes.
    #
    # The named volume is what makes that durable: the image declares an
    # anonymous VOLUME /data, which does not reliably survive the container
    # being recreated.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_dev}@db:5432/${POSTGRES_DB:-acm}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acm}:${POSTGRES_PASSWORD:-acm_dev}@db:5432/${POSTGRES_DB:-acm}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      # Daily pg_dump output lives here. Persisted across worker restarts
      # so retention windows survive a `docker compose up`.
      - db_backups:/var/backups/acm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `--beat` runs the periodic-task scheduler embedded in this worker
    # process. Embedded beat is fine at our scale; if we later run multiple
    # workers we'd split beat into its own dedicated service so it stays
    # singleton.
    #
    # `watchmedo auto-restart` wraps celery so a code change to anything
    # under /app/app/*.py SIGTERMs and respawns the worker. Mirrors what
    # uvicorn --reload does for the api service. Without this, editing a
    # task or service file leaves the worker running stale code until a
    # manual `docker compose restart worker` (which has bitten us during
    # bulk-publish iteration: the api hot-reloaded but the worker kept
    # the old field-injection logic until restarted).
    #
    # Debounce 0.5s collapses rapid IDE saves into one restart. SIGTERM
    # (instead of the watchmedo default SIGKILL) lets Celery flush its
    # current task and unack any in-flight messages cleanly.
    #
    # --debug-force-polling is essential on Windows + macOS: native
    # inotify events don't reliably propagate from the host into Docker
    # Desktop's Linux VM across the bind mount, so watchmedo would never
    # fire on save. Polling has a small CPU cost (an os.stat per file
    # per interval) which is fine for the dozens of files under
    # ./backend/app. On native Linux dev this flag is harmless.
    #
    # Prod runs celery directly — see docker-compose.prod.yml; watchmedo
    # is harmless dead code there.
    command: >
      watchmedo auto-restart
      --directory=/app/app
      --pattern=*.py
      --recursive
      --signal SIGTERM
      --debounce-interval=0.5
      --debug-force-polling
      --
      celery -A app.tasks.celery_app worker --beat --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-8}
    healthcheck:
      # `inspect ping` round-trips a control message through the broker to a
      # live worker. Exits 0 only if at least one worker replies. Catches
      # wedges where the process is alive but no longer consuming tasks.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Optional: only used if you really want the frontend in Docker.
  # On Windows we strongly recommend running `npm run dev` natively in ./frontend instead.
  # Enable with: docker compose --profile docker-web up
  web:
    profiles: ["docker-web"]
    build:
      context: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3010}:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      - api
    command: npm run dev:docker

volumes:
  db_data:
  db_backups:
  # Broker durability — see the redis service comment.
  redis_data:
  web_node_modules:
  web_next_cache:
